
name: Build TikTok Monitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check project files
        run: |
          echo "Checking uploaded source files"
          test -f dashboard.py
          test -f requirements.txt
          python3 -m py_compile dashboard.py
          echo "Source files passed the basic check"

