name: Build TikTok Monitor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'dashboard.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python for source validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source
        run: |
          python -m py_compile dashboard.py
          python -m py_compile app/src/main/python/dashboard.py
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/amer/tiktokmonitor/MainActivity.java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokMonitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
