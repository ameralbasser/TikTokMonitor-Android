name: Build TikTok Monitor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'dashboard.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python for source validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source
        run: |
          python -m py_compile dashboard.py
          python -m py_compile app/src/main/python/dashboard.py
          python -m pip install 'TikTokLive==6.6.5'
          python -c "from TikTokLive import TikTokLiveClient; from TikTokLive.events import ConnectEvent, CommentEvent, GiftEvent, LikeEvent, FollowEvent, ShareEvent, JoinEvent, RoomUserSeqEvent, LiveEndEvent, LinkMicBattleEvent; from TikTokLive.client.web.routes.fetch_video_data import VideoFetchQuality, VideoFetchFormat; print('TikTokLive import smoke test passed')"
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/amer/tiktokmonitor/MainActivity.java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Android FFmpeg runtime
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ffmpeg
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/rhythmcache/ffmpeg-android/releases/download/build-264/termux-ffmpeg-8.0-git--ee2eb6c-arm64-v8a.deb' \
            -o /tmp/ffmpeg-android.deb
          mkdir -p /tmp/ffmpeg-android
          dpkg-deb -x /tmp/ffmpeg-android.deb /tmp/ffmpeg-android
          echo "Extracted FFmpeg package files:"
          find /tmp/ffmpeg-android -type f | grep -E '/(ffmpeg|lib[^/]+\\.so(\\.[0-9.]+)?)$' | head -n 100 || true
          FFMPEG_PATH="$(find /tmp/ffmpeg-android -type f -name ffmpeg | head -n 1)"
          if [ -z "$FFMPEG_PATH" ]; then
            echo "FFmpeg executable missing from downloaded Android package"
            find /tmp/ffmpeg-android -type f -size +5M -exec file '{}' \\;
            exit 1
          fi
          cp "$FFMPEG_PATH" app/src/main/assets/ffmpeg/ffmpeg
          find /tmp/ffmpeg-android -type f -name 'lib*.so*' -exec cp '{}' app/src/main/assets/ffmpeg/ \;
          test -s app/src/main/assets/ffmpeg/ffmpeg
          echo "Bundled FFmpeg:"
          file app/src/main/assets/ffmpeg/ffmpeg
          ls -lh app/src/main/assets/ffmpeg/
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokMonitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
