plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.amer.tiktokmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amer.tiktokmonitor'
        minSdk 24
        targetSdk 28
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        versionCode 2
        versionName '1.1'
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'pydantic==2.13.5'
            install 'TikTokLive==7.0.1'
        }
    }
}
